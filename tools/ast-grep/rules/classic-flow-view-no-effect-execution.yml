id: classic-flow-view-no-effect-execution
language: Tsx
severity: error
message: Run Classic Flow Effects through scoped Effect Atom commands, not from React views.
files:
  - "**/src/features/transaction-flow/react/**/*.ts"
  - "**/src/features/transaction-flow/react/**/*.tsx"
  - "**/src/features/transaction-flow/ui/**/*.ts"
  - "**/src/features/transaction-flow/ui/**/*.tsx"
rule:
  any:
    - pattern: $RUNTIME.runPromise($$$ARGS)
    - pattern: $RUNTIME.runPromiseExit($$$ARGS)
    - pattern: $RUNTIME.runFork($$$ARGS)
    - pattern: $RUNTIME.runSync($$$ARGS)
    - pattern: $RUNTIME.runSyncExit($$$ARGS)
    - pattern: $RUNTIME.runCallback($$$ARGS)
    - pattern: $RUNTIME["runPromise"]($$$ARGS)
    - pattern: $RUNTIME["runPromiseExit"]($$$ARGS)
    - pattern: $RUNTIME["runFork"]($$$ARGS)
    - pattern: $RUNTIME["runSync"]($$$ARGS)
    - pattern: $RUNTIME["runSyncExit"]($$$ARGS)
    - pattern: $RUNTIME["runCallback"]($$$ARGS)
    - pattern: runPromise($$$ARGS)
    - pattern: runPromiseExit($$$ARGS)
    - pattern: runFork($$$ARGS)
    - pattern: runSync($$$ARGS)
    - pattern: runSyncExit($$$ARGS)
    - pattern: runCallback($$$ARGS)
    - pattern: $RUNTIME.runPromise
    - pattern: $RUNTIME.runPromiseExit
    - pattern: $RUNTIME.runFork
    - pattern: $RUNTIME.runSync
    - pattern: $RUNTIME.runSyncExit
    - pattern: $RUNTIME.runCallback
    - pattern: $RUNTIME["runPromise"]
    - pattern: $RUNTIME["runPromiseExit"]
    - pattern: $RUNTIME["runFork"]
    - pattern: $RUNTIME["runSync"]
    - pattern: $RUNTIME["runSyncExit"]
    - pattern: $RUNTIME["runCallback"]
    - pattern: 'const { runPromise: $RUN } = $RUNTIME'
    - pattern: 'const { runPromiseExit: $RUN } = $RUNTIME'
    - pattern: 'const { runFork: $RUN } = $RUNTIME'
    - pattern: 'const { runSync: $RUN } = $RUNTIME'
    - pattern: 'const { runSyncExit: $RUN } = $RUNTIME'
    - pattern: 'const { runCallback: $RUN } = $RUNTIME'
    - all:
        - kind: import_specifier
        - regex: ^(?:Effect|Runtime|run\w+)(?:\s+as\s+\w+)?$
        - inside:
            any:
              - pattern: import { $$$IMPORTS } from "effect"
              - pattern: import { $$$IMPORTS } from "effect/Effect"
              - pattern: import { $$$IMPORTS } from "effect/Runtime"
            stopBy: end
    - pattern: import * as $RUNTIME from "effect"
    - pattern: import * as $RUNTIME from "effect/Effect"
    - pattern: import * as $RUNTIME from "effect/Runtime"
    - pattern: import $RUNTIME from "effect/Effect"
    - pattern: import $RUNTIME from "effect/Runtime"
