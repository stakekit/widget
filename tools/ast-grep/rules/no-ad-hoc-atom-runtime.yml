id: no-ad-hoc-atom-runtime
language: Tsx
severity: error
message: Widget runtime construction belongs in the approved app runtime modules.
files:
  - packages/widget/src/**/*.ts
  - packages/widget/src/**/*.tsx
ignores:
  - packages/widget/src/generated/**
  - packages/widget/src/app/runtime/app-runtime.ts
  - packages/widget/src/app/runtime/application-base-runtime.ts
  - packages/widget/src/app/runtime/wallet-connector-source-runtime.ts
  - packages/widget/src/app/runtime/wallet-runtime.ts
rule:
  pattern: Atom.runtime($$$ARGS)
