id: no-layout-read-in-features
language: Tsx
severity: error
message: Features are Layout-agnostic; the application composes each Layout. Put a Layout-specific screen under `ui/compact` or `ui/dashboard`, or take a prop the Layout composition supplies.
files:
  - packages/widget/src/**/*.ts
  - packages/widget/src/**/*.tsx
ignores:
  - packages/widget/src/App.tsx
  - packages/widget/src/app/**
  - packages/widget/src/services/config/**
  - packages/widget/src/features/widget-configuration/**
utils:
  layout-source:
    any:
      - kind: identifier
        regex: ^(?:config|widgetConfig|settings)$
      - kind: call_expression
        any:
          - has:
              field: function
              regex: ^useWidgetPresentation$
          - has:
              field: arguments
              has:
                kind: identifier
                regex: ^widgetConfigAtom$
rule:
  any:
    - kind: call_expression
      all:
        - has:
            field: function
            regex: ^useWidgetConfig$
        - has:
            field: arguments
            has:
              kind: string
              regex: ^["']layout["']$
    - kind: member_expression
      all:
        - has:
            field: property
            regex: ^layout$
        - has:
            field: object
            matches: layout-source
    - kind: variable_declarator
      all:
        - has:
            field: name
            kind: object_pattern
            has:
              any:
                - kind: shorthand_property_identifier_pattern
                  regex: ^layout$
                - kind: pair_pattern
                  has:
                    field: key
                    regex: ^layout$
        - has:
            field: value
            matches: layout-source
