id: no-html-element-outside-design-system
language: Tsx
severity: error
message: 'Features and application composition render no HTML or SVG elements. Compose a part from the Design System (`src/ui/index.ts`); if none fits, extend the Design System instead of working around it.'
note: |
  See docs/design-system.md, "Extending instead of working around". The
  exact-path `ignores` are the files not migrated yet, mirrored from
  packages/widget/scripts/architecture/design-system-allowlist.ts.
files:
  - packages/widget/src/features/**
  - packages/widget/src/app/**
  - packages/widget/src/App.tsx
rule:
  any:
    - any:
        - kind: jsx_opening_element
        - kind: jsx_self_closing_element
      has:
        field: name
        regex: ^[a-z]
    # `createElement("div")` and `React.createElement("svg", …)`.
    - kind: call_expression
      all:
        - has:
            field: function
            regex: ^(?:React\.)?createElement$
        - has:
            field: arguments
            has:
              nthChild: 1
              kind: string
              regex: ^["'][a-z]
ignores:
  - packages/widget/src/app/composition/providers/theme-wrapper.tsx
  - packages/widget/src/app/layouts/compact/compact-routes.tsx
  - packages/widget/src/app/layouts/dashboard/dashboard-tabs/tab.tsx
  - packages/widget/src/features/activity/ui/activity-details/activity-details.page.tsx
  - packages/widget/src/features/activity/ui/activity-page/components/activity-icon/index.tsx
  - packages/widget/src/features/borrow/market-position/ui/forms/repay-action-form.tsx
  - packages/widget/src/features/earn/ui/compact/earn-page/earn.page.tsx
