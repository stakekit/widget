id: no-source-less-type-export
language: Tsx
severity: error
message: Export local types at their definition and import external types from their defining module.
files:
  - packages/widget/src/**/*.ts
  - packages/widget/src/**/*.tsx
ignores:
  - packages/widget/src/index.package.ts
  - packages/widget/src/index.bundle.ts
  - packages/widget/src/public-api/index.package.ts
  - packages/widget/src/public-api/index.bundle.ts
rule:
  all:
    - kind: export_statement
    - regex: ^export\s+(?:type\s*\{\s*[^}\s]|\{\s*type\b)
    - not:
        regex: \bfrom\s+["']
