id: no-raw-design-value
language: Tsx
severity: error
message: 'Design System styles read sizes, type, radii, shadows, layers and durations from tokens, never from raw values. Use the matching token or add one to the token definitions (`ui/tokens/`).'
note: |
  Rejected inside StyleX definitions: non-zero numbers on properties that take
  a length, any px, ms or s value, and any literal font size, font weight, line
  height, letter spacing, radius, shadow, z-index, duration or delay. Unitless
  counts (flex, opacity, order and the like), 0, percentages and CSS keywords
  stay allowed. Token definitions (`ui/tokens/`, the theme definitions in
  `ui/theme/`) and artwork (`ui/artwork/`) are exempt by location.
files:
  - packages/widget/src/ui/**
ignores:
  - packages/widget/src/ui/tokens/**
  - packages/widget/src/ui/theme/*.ts
  - packages/widget/src/ui/artwork/**
utils:
  stylex-definition:
    kind: call_expression
    has:
      field: function
      regex: ^stylex\.(?:create|keyframes|createTheme|defineVars|defineConsts|firstThatWorks|viewTransitionClass|positionTry)$
  in-stylex-value:
    all:
      - inside:
          stopBy: end
          matches: stylex-definition
      - not:
          inside:
            kind: pair
            field: key
  design-value-property:
    kind: pair
    has:
      field: key
      regex: ^["']?(?:fontSize|fontWeight|lineHeight|letterSpacing|border(?:Top|Bottom|Start|End)?(?:Left|Right|Start|End)?Radius|boxShadow|textShadow|zIndex|transition|animation|(?:transition|animation)(?:Duration|Delay))["']?$
  unitless-property:
    kind: pair
    has:
      field: key
      regex: ^["']?(?:flex|flexGrow|flexShrink|opacity|fillOpacity|strokeOpacity|stopOpacity|order|aspectRatio|animationIterationCount|columnCount|gridColumn(?:Start|End)?|gridRow(?:Start|End)?|scale|lineClamp|WebkitLineClamp|tabSize|widows|orphans)["']?$
  css-keyword:
    regex: ^["']?(?:0(?:px|m?s)?|inherit|initial|unset|revert|revert-layer|none|normal|auto)["']?$
rule:
  any:
    - all:
        - kind: number
        - not:
            regex: ^0*\.?0*$
        - matches: in-stylex-value
        - not:
            inside:
              kind: subscript_expression
        - not:
            inside:
              stopBy: end
              matches: unitless-property
    - all:
        - kind: string_fragment
        - regex: (?:^|[^\w.-])-?(?:[1-9]\d*(?:\.\d+)?|0?\.\d*[1-9]\d*)(?:px|m?s)\b
        - inside:
            stopBy: end
            matches: in-stylex-value
    - all:
        - any:
            - kind: string
            - kind: template_string
            - kind: number
        - matches: in-stylex-value
        - inside:
            stopBy: end
            matches: design-value-property
        - not:
            matches: css-keyword
