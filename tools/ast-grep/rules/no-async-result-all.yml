id: no-async-result-all
language: Tsx
severity: error
message: Combine async results with combineAsyncResults from shared/effect/async-result; AsyncResult.all drops the combined previous success on failure.
files:
  - packages/widget/src/**/*.ts
  - packages/widget/src/**/*.tsx
  - packages/widget/tests/**/*.ts
  - packages/widget/tests/**/*.tsx
ignores:
  - packages/widget/src/generated/**
  - packages/widget/src/shared/effect/async-result.ts
rule:
  pattern: AsyncResult.all
