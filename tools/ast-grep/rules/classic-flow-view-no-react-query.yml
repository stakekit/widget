id: classic-flow-view-no-react-query
language: Tsx
severity: error
message: Classic Flow resources belong in Effect Atom, not React Query.
files:
  - "**/src/features/transaction-flow/react/**/*.ts"
  - "**/src/features/transaction-flow/react/**/*.tsx"
  - "**/src/features/transaction-flow/ui/**/*.ts"
  - "**/src/features/transaction-flow/ui/**/*.tsx"
rule:
  any:
    - kind: import_statement
      regex: '(?:from\s+)?["'']@tanstack/react-query(?:/[^"'']+)?["'']'
    - kind: call_expression
      regex: '^(?:import|require)\(["'']@tanstack/react-query(?:/[^"'']+)?["'']\)'
