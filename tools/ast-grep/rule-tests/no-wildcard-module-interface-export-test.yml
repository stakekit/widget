id: no-wildcard-module-interface-export
valid:
  - 'export { Model } from "./model"'
  - 'export type { Model } from "./model"'
  - 'export { type Model } from "./model"'
  # Domain contract: selected stable types and runtime values.
  - 'export type { WalletAddress } from "./address"'
  - 'export const supportedNetworks = networks'
  # Design System interfaces.
  - 'export { Button, type ButtonProps } from "./components/button"'
  - 'export { ThemeRoot } from "./theme/theme-root"'
invalid:
  - 'export * from "./model"'
  - 'export * as Model from "./model"'
  - 'export type * from "./model"'
  - 'export type * as Wallet from "./wallet"'
  - 'export * from "./components/button"'
  - 'export * as Theme from "./theme/theme-root"'
