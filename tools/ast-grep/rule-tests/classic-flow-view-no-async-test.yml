id: classic-flow-view-no-async
valid:
  - 'const onClick = () => dispatch({ _tag: "Continue" })'
  - 'function normalize(value: string) { return value.trim() }'
invalid:
  - 'const onClick = async () => await prepare()'
  - 'async function onRetry() { await retry() }'
  - 'const value = async function () { return await load() }'
  - 'const onClick = () => prepare().then(dispatch)'
  - 'const onRetry = () => request().catch(report)'
  - 'const pending = Promise.all(requests)'
  - 'const onClick = () => void prepare()'
  - 'const pending = Promise.allSettled(requests)'
  - 'const onClick = () => prepare()?.then?.(dispatch)'
  - 'const pending = globalThis.Promise.all(requests)'
