id: no-manual-memo
valid:
  - 'const total = items.length * price'
  - 'const memo = { note: "useMemo" }'
  - 'transaction.memo(value)'
  - |
    const List = () => {
      "use no memo";
      const end = useMemo(() => items.at(-1), [items]);
      return end;
    };
