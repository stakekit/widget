  oxc-transform-react: ^0.156.0
  oxfmt: 0.78.0
  oxlint: 1.93.0
  playwright: ^1.65.0
  postcss: ^8.5.32
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^17.1.13
  react-is: ^19.3.1
  react-router: ^8.5.1
  recharts: ^3.10.1
  rxjs: ~7.8.2
  scheduler: ">=0.25.0 <0.29.0"
  serve: ^14.2.7
  storybook: 10.6.7
  tslib: ^2.9.1
  tsx: ^4.23.15
