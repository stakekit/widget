minimumReleaseAge: 4320

overrides:
  "@reown/appkit": 1.8.24
  # chain-registry's own range would drift onto the new schema (see the chain-registry catalog note).
  "chain-registry>@chain-registry/types": 0.50.410
  # oxlint's optional peer; pnpm would install it. The type-aware rules run on
  # the tsrs that @effect/tsgo bundles (`effect-tsgo --tsrs-lint`).
  oxlint-tsgolint: "-"
