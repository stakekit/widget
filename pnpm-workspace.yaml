  "@reown/appkit": false
  "@stellar/stellar-sdk": false
  blake-hash: false
  bufferutil: false
  chacha-native: false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  secp256k1: false
  sharp: false
  tiny-secp256k1: false
  usb: false
  utf-8-validate: false

