[settings]
# For the task artifact cache.
experimental = true
lockfile = true
task.output = "prefix"
task.timings = true
# Compare source contents, not timestamps: a branch switch or a new worktree
# rewrites timestamps without changing what a task reads.
task.source_freshness_hash_contents = true
# Each build:widget entry stores dist (about 45 MB); mise evicts the least
# recently used entries past this.
task.cache_max_size = "2GiB"

[tools]
node = "24"
"aqua:pnpm/pnpm" = "12"

# Workspace tasks. Package commands stay in each package.json; these compose them.
# Root package.json scripts alias these tasks, so `pnpm <task>` and `mise run <task>` are equivalent.
# The cached checks and builds live in tools/mise/cached-tasks.toml.

[task_config]
includes = ["tools/mise/cached-tasks.toml"]

# What the cached tasks read. Docs and generated output stay out.
[task_config.input_groups]
widget = [
  "packages/widget/{src,tests,scripts,playground,vite,.storybook,public,ledger-manifest}/**",
  "packages/widget/*.{json,ts,html}",
  "packages/widget/.{oxlintrc,jscpd}.json",
  # Vite reads them: API URLs reach the build and the tests.
  "packages/widget/.env*",
  "!packages/widget/**/*.md",
  "!packages/widget/**/.DS_Store",
  "!packages/widget/**/.vitest/**",
  "@group:workspace",
]
examples = [
  "packages/examples/*/{src,public,app,pages}/**",
  "packages/examples/*/*.{json,ts,mts,mjs,js,html,css}",
  "packages/examples/*/.env*",
  "!packages/examples/**/.DS_Store",
  # Next.js rewrites it on every dev server start and build.
  "!packages/examples/*/next-env.d.ts",
  "@group:workspace",
]
workspace = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.base.json",
  "tsconfig.json",
  ".oxlintrc.json",
  # Knip skips gitignored files.
  ".gitignore",
]

# Every task with sources and outputs stores its result. A cached result must
# follow from the key alone, so tasks that read the network or the clock stay
# uncached. Shell-exported overrides of the .env API settings join the key; the
# API key only as a hash, since mise stores `env` values verbatim.
[task_config.cache]
enabled = true
env = [
  "VITE_API_URL",
  "VITE_BORROW_API_URL",
  "VITE_YIELDS_API_URL",
  "VITE_FORCE_ADDRESS",
]
command_inputs = ["echo \"api-key:${VITE_API_KEY:-}\""]

[tasks.dev]
raw = true
run = "pnpm --filter @stakekit/widget dev"

# One oxfmt pass formats the whole repository; oxlint runs per package.
[tasks."lint:format"]
run = "pnpm exec oxfmt --check ."

[tasks.lint]
description = "Formatting, widget and example lint"
depends = ["lint:format", "lint:widget", "lint:examples"]

[tasks.format]
run = "pnpm exec oxfmt ."

[tasks.clean]
run = "pnpm --recursive run clean"

[tasks.test]
description = "Widget unit, jsdom, Chromium and Storybook tests"
depends = ["test:unit", "test:dom", "test:browser", "test:storybook"]

[tasks."test:smoke"]
run = "pnpm --filter @stakekit/widget test:smoke"

# Continue independent gates so one run reports every failure, then fail if any did.
# Mise suppresses nested timings by default; keep individual gate durations visible.
[tasks.check]
description = "Lint, hygiene, tests and builds"
run = "MISE_TASK_TIMINGS=1 mise run --jobs 4 --continue-on-error --output prefix lint ::: check-hygiene ::: test ::: build"
output = "interleave"
