name: "API drift"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  MISE_LOCKED: 1

jobs:
  generated-api-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install mise
        run: |
          curl https://mise.run | MISE_VERSION=v2026.7.17 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          mise install

      - run: pnpm install --frozen-lockfile

      - name: Regenerate API clients from production specs
        run: pnpm -F @stakekit/widget gen:api

      - name: Check generated API clients for drift
        run: |
          git add --intent-to-add -- packages/widget/src/generated
          if ! git diff --exit-code -- packages/widget/src/generated; then
            echo "::error::Generated API clients drifted from the production API specs. Run 'pnpm -F @stakekit/widget gen:api' and commit the changes under packages/widget/src/generated."
            exit 1
          fi
