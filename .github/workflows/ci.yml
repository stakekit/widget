name: "CI"

on:
  pull_request:
  # Runs on main keep the dependency, toolchain and browser caches warm for pull requests:
  # caches saved on a PR branch are visible only to that branch.
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"

# One job per check, so checks run in parallel and a failure names its check.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
      - run: mise run lint:widget
      - run: mise run lint:ast

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
      - run: mise run check-hygiene

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
      - run: mise run test:unit

  dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
      - run: mise run test:dom

  # Browser test files run serially (fileParallelism: false); shards split them across runners.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: browser (${{ matrix.shard }}/2)
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: mise run test:browser -- --shard=${{ matrix.shard }}/2

  # One invocation, so the widget build that both tasks depend on runs once.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
      - run: "mise run build ::: lint:examples"

  production-consumer-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Secrets are unavailable to job-level `if`, and to fork pull requests.
      - name: Check smoke API key
        id: smoke-key
        env:
          STAKEKIT_SMOKE_API_KEY: ${{ secrets.STAKEKIT_SMOKE_API_KEY }}
        run: |
          if [ -n "$STAKEKIT_SMOKE_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping production-consumer smoke test because STAKEKIT_SMOKE_API_KEY is unavailable."
          fi

      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: steps.smoke-key.outputs.available == 'true'

      - uses: ./.github/actions/setup
        if: steps.smoke-key.outputs.available == 'true'

      - uses: ./.github/actions/playwright
        if: steps.smoke-key.outputs.available == 'true'

      - name: Run production-consumer smoke test
        if: steps.smoke-key.outputs.available == 'true'
        env:
          VITE_API_KEY: ${{ secrets.STAKEKIT_SMOKE_API_KEY }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.STAKEKIT_SMOKE_API_KEY }}
        run: mise run test:smoke
