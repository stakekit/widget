name: Setup
description: Installs the pinned mise, the locked toolchain and, by default, the locked dependencies.

inputs:
  install-dependencies:
    description: Run pnpm install after the toolchain; jobs that only need node and pnpm skip it.
    default: "true"
  verify-lockfile:
    description: >-
      Verify the lockfile against the supply-chain policies in pnpm-workspace.yaml
      (minimumReleaseAge). Exactly one CI job verifies; the others pass
      --trust-lockfile and skip the registry round trip for every entry.
    default: "false"

runs:
  using: composite
  steps:
    # actions/cache@v6.1.0
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'tools/setup-mise.sh') }}

    - name: Install mise and locked toolchain
      shell: bash
      run: ./tools/setup-mise.sh

    - id: pnpm-store
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    # Cache the store, not node_modules: install must still run the root prepare script
    # (effect-tsgo patch).
    # actions/cache@v6.1.0
    - id: pnpm-store-cache
      if: inputs.install-dependencies == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'mise.lock') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Install locked dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        # `cond && a || b` yields b when a is empty, so both branches name a flag.
        LOCKFILE_TRUST: ${{ inputs.verify-lockfile == 'true' && '--no-trust-lockfile' || '--trust-lockfile' }}
      run: pnpm install --frozen-lockfile --prefer-offline "$LOCKFILE_TRUST"

    # A store restored from an older lockfile's key still holds the packages
    # that lockfile dropped. Prune them before this key's store is saved, so
    # the cache does not grow with every lockfile change.
    - name: Prune packages the lockfile no longer uses
      if: inputs.install-dependencies == 'true' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm store prune --yes
